events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream api {
        # Упавшая копия выводится из ротации после первой ошибки на 5 секунд,
        # а запрос, который на ней оборвался, nginx повторяет на соседней.
        server api-a:8080 max_fails=1 fail_timeout=5s;
        server api-b:8080 max_fails=1 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80;
        client_max_body_size 0;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Адрес клиента перезаписывается, а не дописывается: иначе клиент подставит
            # в X-Forwarded-For чужой адрес и обойдёт блокировку перебора паролей.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_request_buffering off;
        }
    }
}
